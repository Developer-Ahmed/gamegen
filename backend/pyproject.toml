[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Developer-Ahmed",email = "ahmedcbozdogan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=5.2.4,<6.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "djangorestframework (>=3.16.0,<4.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "langchain-core (>=0.3.74,<0.4.0)",
    "langgraph (>=0.6.4,<0.7.0)",
    "langchain-openai (>=0.3.30,<0.4.0)",
    "langchain-tavily (>=0.2.11,<0.3.0)",
    "playwright (>=1.54.0,<2.0.0)",
    "e2b (>=1.11.1,<2.0.0)",
    "langchain-google-genai (>=2.1.10,<3.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "tokenizers (>=0.22.0,<0.23.0)",
    "openai-harmony (>=0.0.8,<0.1.0)",
]

[tool.poetry]
packages = [
    {include = "agent"},
    {include = "backend"},
    {include = "gamegen"},
    {include = "scripts"},
]
include = [
    {path = "agent/components/**", format = ["sdist", "wheel"]},
    {path = "agent/tokenizers/**", format = ["sdist", "wheel"]},
]

[tool.poetry.scripts]
start_dev = "scripts.start_dev:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
